<html lang="id">
<head>
<meta charset="UTF-8">
<title>🎯 TTS Informatika - 50 Langkah</title>
<style>

  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height:100vh; color:#fff; padding:15px;
  }
  .container { max-width:1400px; margin:auto; }
  .header {
    text-align:center; padding:15px;

  }
  .header h1 { color:#f39c12; font-size:1.8em; }

  .stats {
    display:flex; justify-content:space-around;
    background:rgba(255,255,255,0.08); padding:10px;
    border-radius:10px; margin-bottom:15px; flex-wrap:wrap; gap:10px;
  }
  .stat { text-align:center; min-width:80px; }
  .stat-val { font-size:1.4em; color:#f39c12; font-weight:bold; }
  .stat-lbl { font-size:0.8em; color:#bbb; }
  .game-layout {
    display:grid; grid-template-columns:1fr 1fr; gap:15px;
  }
  @media(max-width:900px){ .game-layout{grid-template-columns:1fr;} }
  .grid-container {
    background:rgba(0,0,0,0.4); padding:15px;
    border-radius:12px; overflow-x:auto;
  }
  .tts-grid {
    display:grid;
    grid-template-columns:repeat(15, 1fr);
    gap:2px; margin:auto; max-width:600px;
  }
  .cell {
    aspect-ratio:1; background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:1.2em; font-weight:bold; color:#333;
    border-radius:3px; cursor:pointer;
    position:relative; transition:0.2s;
  }
  .cell.black { background:#2c3e50; cursor:default; }
  .cell.active { background:#fff; }
  .cell.selected { background:#f39c12; color:#fff; }
  .cell.correct { background:#27ae60; color:#fff; }
  .cell.wrong { background:#e74c3c; color:#fff; }
  .cell.highlight { background:#3498db; color:#fff; }
  .cell-number {
    position:absolute; top:1px; left:2px;
    font-size:0.5em; color:#666; font-weight:normal;
  }
  .cell input {
    width:100%; height:100%; border:none;
    text-align:center; font-size:1em; font-weight:bold;
    background:transparent; color:#333; outline:none;
    text-transform:uppercase;
  }
  .question-panel {
    background:rgba(0,0,0,0.4); padding:15px;
    border-radius:12px; max-height:700px; overflow-y:auto;
  }
  .tabs {
    display:flex; gap:5px; margin-bottom:15px;
  }
  .tab {
    flex:1; padding:10px; text-align:center;
    background:rgba(255,255,255,0.1); border-radius:8px;
    cursor:pointer; transition:0.2s; font-weight:bold;
  }
  .tab.active { background:#f39c12; color:#000; }
  .tab:hover { background:rgba(243,156,18,0.3); }
  .question-list {
    display:grid; gap:8px;
  }
  .question-item {
    background:rgba(255,255,255,0.08); padding:10px;
    border-radius:8px; cursor:pointer; transition:0.2s;
    border-left:4px solid transparent;
  }
  .question-item:hover { background:rgba(255,255,255,0.15); }
  .question-item.answered { border-left-color:#27ae60; background:rgba(39,174,96,0.1); }
  .question-item.current { border-left-color:#f39c12; background:rgba(243,156,18,0.2); }
  .q-number {
    display:inline-block; background:#f39c12; color:#000;
    padding:2px 8px; border-radius:4px; font-weight:bold;
    font-size:0.85em; margin-right:8px;
  }
  .q-direction {
    display:inline-block; background:#3498db; color:#fff;
    padding:2px 6px; border-radius:4px; font-size:0.75em;
    margin-left:5px;
  }
  .q-clue { margin-top:5px; font-size:0.9em; line-height:1.4; }

    display:inline-block; padding:2px 6px; border-radius:4px;

  }
  .cat-se { background:#4285f4; }
  .cat-fact { background:#e74c3c; }
  .cat-lateral { background:#9b59b6; }
  .cat-doc { background:#27ae60; }
  .btn {
    background:#f39c12; color:#000; border:none;
    padding:10px 20px; border-radius:8px; cursor:pointer;
    font-size:0.95em; font-weight:bold; margin-top:10px;
    transition:0.2s;
  }
  .btn:hover { background:#e67e22; }
  .btn-secondary { background:#555; color:#fff; }
  .btn-group { display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; }
  .feedback {
    background:rgba(243,156,18,0.2); padding:12px;
    border-radius:8px; margin-top:10px;
    border-left:4px solid #f39c12;
    animation:fadeIn 0.3s;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }
  .win-screen {
    text-align:center; padding:25px;
    background:linear-gradient(135deg,rgba(39,174,96,0.3),rgba(243,156,18,0.3));
    border-radius:15px; margin-top:15px;
  }
  .win-screen h2 { color:#27ae60; font-size:1.8em; margin-bottom:10px; }
  .progress-bar {
    background:rgba(255,255,255,0.1); height:8px;
    border-radius:4px; overflow:hidden; margin:10px 0;
  }
  .progress-fill {
    height:100%; background:linear-gradient(90deg,#f39c12,#e67e22);
    transition:width 0.4s;
  }
  .legend {
    display:flex; gap:10px; flex-wrap:wrap;
    margin:10px 0; font-size:0.85em;
  }
  .legend-item {
    display:flex; align-items:center; gap:5px;
  }
  .legend-color {
    width:20px; height:20px; border-radius:3px;
  }
</style>
</head>

wordLayout.forEach(w => {
  for (let i = 0; i < w.word.length; i++) {
    const r = w.dir === 'across' ? w.row : w.row + i;
    const c = w.dir === 'across' ? w.col + i : w.col;
    if (r < GRID_SIZE && c < GRID_SIZE) {
      grid[r][c] = { letter: w.word[i], words: [] };
    }
  }
  // Mark which words pass through each cell
  for (let i = 0; i < w.word.length; i++) {
    const r = w.dir === 'across' ? w.row : w.row + i;
    const c = w.dir === 'across' ? w.col + i : w.col;
    if (r < GRID_SIZE && c < GRID_SIZE && grid[r][c]) {
      grid[r][c].words.push(w.num);
    }
  }
});

  const numberedCells = {};
  wordLayout.forEach(w => {
    const key = `${w.row}-${w.col}`;
    if (!numberedCells[key]) numberedCells[key] = [];
    numberedCells[key].push(w.num);
  });
  
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      
      if (grid[r][c]) {
        cell.classList.add('active');
        
        // Add number if this is start of a word
        const key = `${r}-${c}`;
        if (numberedCells[key]) {
          const numSpan = document.createElement('span');
          numSpan.className = 'cell-number';
          numSpan.textContent = Math.min(...numberedCells[key]);
          cell.appendChild(numSpan);
        }
        
        // Add input
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 1;
        input.dataset.row = r;
        input.dataset.col = c;
        input.oninput = (e) => handleInput(e, r, c);
        input.onfocus = () => selectCell(r, c);
        cell.appendChild(input);
        
        cell.onclick = () => selectCell(r, c);
      } else {
        cell.classList.add('black');
      }
      
      gridEl.appendChild(cell);
    }
  }
}

function handleInput(e, row, col) {
  const val = e.target.value.toUpperCase();
  e.target.value = val;
  
  // Auto-advance to next cell
  if (val && state.currentQ) {
    const q = questions.find(q => q.num === state.currentQ);
    if (q) {
      const wordData = wordLayout.find(w => w.num === q.num);
      const idx = getWordIndex(wordData, row, col);
      if (idx !== -1 && idx < wordData.word.length - 1) {
        const nextR = q.dir === 'across' ? row : row + 1;
        const nextC = q.dir === 'across' ? col + 1 : col;
        const nextInput = document.querySelector(`input[data-row="${nextR}"][data-col="${nextC}"]`);
        if (nextInput) nextInput.focus();
      }
    }
  }
}

function getWordIndex(wordData, row, col) {
  for (let i = 0; i < wordData.word.length; i++) {
    const r = wordData.dir === 'across' ? wordData.row : wordData.row + i;
    const c = wordData.dir === 'across' ? wordData.col + i : wordData.col;
    if (r === row && c === col) return i;
  }
  return -1;
}

function selectCell(row, col) {
  // Clear previous selection
  document.querySelectorAll('.cell').forEach(c => {
    c.classList.remove('selected', 'highlight');
  });
  
  // Highlight current cell
  const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
  if (cell) cell.classList.add('selected');
  
  // Find which question this cell belongs to
  const cellData = grid[row][col];
  if (cellData && cellData.words.length > 0) {
    const qNum = cellData.words[0];
    state.currentQ = qNum;
    
    // Highlight all cells in this word
    const wordData = wordLayout.find(w => w.num === qNum);
    if (wordData) {
      for (let i = 0; i < wordData.word.length; i++) {
        const r = wordData.dir === 'across' ? wordData.row : wordData.row + i;
        const c = wordData.dir === 'across' ? wordData.col + i : wordData.col;
        const wCell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        if (wCell) wCell.classList.add('highlight');
      }
    }
    
    // Update question list
    updateQuestionList();
  }
}

// ============ RENDER QUESTIONS ============
function renderQuestions() {
  updateQuestionList();
}

function updateQuestionList() {
  const list = document.getElementById('questionList');
  const filtered = questions.filter(q => q.dir === state.currentTab);
  
  list.innerHTML = filtered.map(q => `
    <div class="question-item ${state.answered.has(q.num)?'answered':''} ${state.currentQ===q.num?'current':''}" 
         onclick="selectQuestion(${q.num})">
      <span class="q-number">${q.num}</span>
      <span class="q-direction">${q.dir === 'across' ? '→' : '↓'}</span>
      <span class="q-category cat-${q.cat}">${getCatName(q.cat)}</span>
      <div class="q-clue">${q.clue}</div>
    </div>
  `).join('');
}

function getCatName(cat) {
  const names = { se:'Search Engine', fact:'Fakta', lateral:'Lateral', doc:'Dokumen' };
  return names[cat] || cat;
}

function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  updateQuestionList();
}

function selectQuestion(num) {
  state.currentQ = num;
  const q = questions.find(q => q.num === num);
  const wordData = wordLayout.find(w => w.num === num);
  
  // Highlight word in grid
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected', 'highlight'));
  
  if (wordData) {
    for (let i = 0; i < wordData.word.length; i++) {
      const r = wordData.dir === 'across' ? wordData.row : wordData.row + i;
      const c = wordData.dir === 'across' ? wordData.col + i : wordData.col;
      const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
      if (cell) {
        cell.classList.add('highlight');
        if (i === 0) cell.classList.add('selected');
      }
    }
    
    // Focus first input
    const firstR = wordData.row;
    const firstC = wordData.col;
    const firstInput = document.querySelector(`input[data-row="${firstR}"][data-col="${firstC}"]`);
    if (firstInput) firstInput.focus();
  }
  
  updateQuestionList();
}

// ============ CHECK ANSWERS ============
function checkAllAnswers() {
  let correct = 0;
  let total = 0;
  
  questions.forEach(q => {
    const wordData = wordLayout.find(w => w.num === q.num);
    if (!wordData) return;
    
    let wordCorrect = true;
    for (let i = 0; i < q.answer.length; i++) {
      const r = q.dir === 'across' ? wordData.row : wordData.row + i;
      const c = q.dir === 'across' ? wordData.col + i : wordData.col;
      const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
      
      if (input) {
        total++;
        if (input.value.toUpperCase() === q.answer[i]) {
          input.parentElement.classList.add('correct');
          input.parentElement.classList.remove('wrong');
        } else {
          input.parentElement.classList.add('wrong');
          input.parentElement.classList.remove('correct');
          wordCorrect = false;
        }
      }
    }
    
    if (wordCorrect && !state.answered.has(q.num)) {
      state.answered.add(q.num);
      state.score += 20;
      state.streak++;
      correct++;
      
      // Show feedback
      showFeedback(q);
    }
  });
  
  updateStats();
  
  if (state.answered.size === 50) {
    setTimeout(() => showWinScreen(), 1000);
  }
}

function showFeedback(q) {
  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.innerHTML = `
    <strong>✅ Benar! +20 poin</strong><br>
    <b>${q.num}. ${q.answer}</b> - ${q.explain}
  `;
  document.querySelector('.grid-container').appendChild(feedback);
  setTimeout(() => feedback.remove(), 4000);
}

function revealAnswer() {
  if (!state.currentQ) {
    alert('Pilih pertanyaan dulu!');
    return;
  }
  
  const q = questions.find(q => q.num === state.currentQ);
  const wordData = wordLayout.find(w => w.num === state.currentQ);
  
  if (q && wordData) {
    for (let i = 0; i < q.answer.length; i++) {
      const r = q.dir === 'across' ? wordData.row : wordData.row + i;
      const c = q.dir === 'across' ? wordData.col + i : wordData.col;
      const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
      if (input) {
        input.value = q.answer[i];
        input.parentElement.classList.add('correct');
      }
    }
    
    if (!state.answered.has(q.num)) {
      state.answered.add(q.num);
      state.score += 10; // Less points for reveal
      updateStats();
    }
  }
}

function resetGame() {
  if (!confirm('Yakin ingin reset? Semua jawaban akan dihapus.')) return;
  
  state.score = 0;
  state.answered = new Set();
  state.streak = 0;
  state.currentQ = null;
  
  document.querySelectorAll('input').forEach(input => {
    input.value = '';
    input.parentElement.classList.remove('correct', 'wrong');
  });
  
  updateStats();
}

// ============ STATS ============
function updateStats() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('progress').textContent = `${state.answered.size}/50`;
  document.getElementById('streak').textContent = state.streak;
  document.getElementById('progressBar').style.width = `${(state.answered.size/50)*100}%`;
}

// ============ TIMER ============
function startTimer() {
  state.timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }, 1000);
}

// ============ WIN SCREEN ============
function showWinScreen() {
  clearInterval(state.timerInterval);
  
  const content = document.querySelector('.container');
  content.innerHTML = `
    <div class="win-screen">
      <h2>🎉 SELAMAT! TTS SELESAI! 🎉</h2>
      <p style="font-size:1.2em;">Kamu berhasil menyelesaikan semua 50 pertanyaan!</p>
      <p style="margin:15px 0;">Skor Akhir: <strong style="color:#f39c12;font-size:2em;">${state.score}</strong></p>
      <p style="margin:10px 0;">Waktu: <b>${document.getElementById('timer').textContent}</b></p>
      
      <h3 style="color:#f39c12;margin:20px 0;">📚 Materi yang Dikuasai:</h3>
      <div style="text-align:left;max-width:500px;margin:15px auto;">
        <ul style="list-style:none;line-height:2;">
          <li>✅ <b>Search Engine</b> - Operator pencarian, kata kunci, filetype</li>
          <li>✅ <b>Pemeriksa Fakta</b> - Hoaks, verifikasi, sumber kredibel</li>
          <li>✅ <b>Membaca Lateral</b> - Tab baru, kredibilitas, independen</li>
          <li>✅ <b>Pengolahan Dokumen</b> - Header, tabel, fungsi spreadsheet</li>
        </ul>
      </div>
      
      <div class="btn-group" style="justify-content:center;">
        <button class="btn" onclick="location.reload()">🔄 Main Lagi</button>
      </div>
    </div>
  `;
}

// ============ INIT ============
renderGrid();
renderQuestions();
updateStats();
startTimer();
</script>
</body>
